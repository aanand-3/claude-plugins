# crew reference — copy to .github/dependabot.yml. Remove ecosystems you don't use.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: npm   # covers pnpm lockfiles
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      js-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
