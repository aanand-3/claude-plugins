# crew reference: import-linter contracts for cli-python. Merge into pyproject.toml.
# Run with `uv run lint-imports`. Replace <package>.

[tool.importlinter]
root_package = "<package>"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "CLI layers: cli → core"
type = "layers"
layers = ["<package>.cli", "<package>.core"]

[[tool.importlinter.contracts]]
name = "Core has no presentation or terminal dependencies"
type = "forbidden"
source_modules = ["<package>.core"]
forbidden_modules = ["<package>.cli", "<package>.adapters", "typer", "rich", "click"]
