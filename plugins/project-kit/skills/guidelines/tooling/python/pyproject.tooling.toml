# project-kit reference tooling for Python apps — merge into <backend_dir>/pyproject.toml in P-001.
# Replace <package> and the Python version; keep sections you don't need out rather than half-configured.

[dependency-groups]
dev = [
  "ruff",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "import-linter",
  "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import sorting
  "B",             # bugbear
  "UP",            # modern syntax
  "SIM", "C4", "PIE", "RET",
  "N",             # naming
  "S",             # security (bandit)
  "PT",            # pytest style
  "ASYNC",         # async pitfalls
  "DTZ",           # timezone-aware datetimes
  "T20",           # no print() — use logging / the CLI console
  "ERA",           # no commented-out code
  "TID",           # tidy imports
  "RUF",
  "PLC0415",       # imports at top level; justify exceptions with `# noqa: PLC0415  <reason>`
  "C90",           # cyclomatic complexity (no god functions)
  "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # too many returns / branches / arguments / statements
]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913"]  # asserts, fake secrets, many fixtures in tests
"src/*/cli/**" = ["T20"]               # CLI presentation layer may print

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]  # size limits from the base pack (Modules & size); module length is checked by check_structure.py
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not live'"
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
  "integration: needs real infrastructure (docker compose services)",
  "scenario: end-to-end business workflow",
  "live: calls real external sandboxes; opt-in with -m live",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
