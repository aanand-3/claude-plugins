# crew policy for the crew repository itself (see docs/vision.md → Policy; `crew.mjs policy show`).
# Lifecycle preset: each step belongs to one role (PM, Architect, Developer, QA, Director); the executive approves the goal set.
preset: lifecycle
budgets:
  max_agents: 3
release:
  refresh_bin: { from: plugins/crew/skills/hub/dist, files: [crew.mjs, ui.html] }
