# The crew repository dogfoods its own hub. Stack facts live in README.md and packages/crew/package.json.
hub:
  wip_limit: 1
  # One shared worktree per plan, created at new-plan; nothing is committed until the plan completes.
  plan_worktrees: true
  # hub.shared: overlaps on these never block staffing; the merge queue resolves them (exact files, not directories).
  shared: [packages/crew/src/hub/cli.ts, packages/crew/src/hub/mcp.ts, packages/crew/src/hub/commands/index.ts, plugins/crew/skills/hub/SKILL.md, plugins/crew/skills/hub/references/model.md, plugins/crew/skills/team/SKILL.md, README.md, "packages/crew/test/**/*.test.ts"]
  # hub.build — the build that writes the generated files (marked linguist-generated in .gitattributes): Release runs it on the
  # current base branch before the plan's one commit; developers run it only to exercise checks that run the bundle.
  build: cd packages/crew && npm run build
  # The full suite: Release runs it before each merge (CI runs the same on pull requests); never per task.
  full_suite: (cd packages/crew && npm run typecheck && npm test && npm run build) && git diff --exit-code -- plugins/crew/skills
