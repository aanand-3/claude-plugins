# The crew repository dogfoods its own hub. Stack facts live in README.md and packages/crew/package.json.
hub:
  wip_limit: 1
  # One shared worktree per plan, created at new-plan; nothing is committed until the plan completes.
  plan_worktrees: true
  # The full suite: Release runs it before each merge (CI runs the same on pull requests); never per task.
  full_suite: (cd packages/crew && npm run typecheck && npm test && npm run build) && git diff --exit-code -- plugins/crew/skills/hub/dist && uvx --with pyyaml pytest tests/crew -q
